<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Evolution Snake</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
#top {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 10px;
}
canvas {
  border: 2px solid white;
}
</style>
</head>

<body>

<h2>Evolution Snake 🧬</h2>
<div id="top">
  <div id="score">Score: 0</div>
  <div id="hearts">❤️❤️❤️</div>
</div>

<canvas id="game" width="640" height="640"></canvas>

<audio id="bgMusic" src="bg-music.mp3" loop></audio>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const heartsEl = document.getElementById("hearts");
const bgMusic = document.getElementById("bgMusic");

const grid = 20;

// ---------- GAME STATE ----------
let snake, food, dx, dy;
let score = 0;
let hearts = 3;
let speed = 200;
let loop;
let musicStarted = false;

let bomb=null, scissors=null, apple=null;
let bombT=0, scissorsT=0, appleT=0;

// ---------- EVOLUTION ----------
const forms = ["🐍","🚗","🐯","🦖","📱","🦅","🐉","🚀","🤖","🌋"];
function stage() {
  return Math.min(Math.floor(score / 100), forms.length - 1);
}

// ---------- MAP TEXTURES ----------
function drawMap() {
  const s = stage();

  // Grass
  if (s === 0) {
    ctx.fillStyle="#1f7a1f";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="rgba(255,255,255,0.1)";
    for(let i=0;i<canvas.width;i+=grid){
      ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke();
      ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(canvas.width,i);ctx.stroke();
    }
    return;
  }

  // Road
  if (s === 1) {
    ctx.fillStyle="#333";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.strokeStyle="#fff";
    ctx.setLineDash([15,15]);
    for(let i=0;i<canvas.width;i+=60){
      ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,canvas.height);ctx.stroke();
    }
    ctx.setLineDash([]);
    return;
  }

  // Jungle
  if (s === 2) {
    ctx.fillStyle="#145214";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }

  // Volcano
  if (s === 3) {
    ctx.fillStyle="#5a0000";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    return;
  }

  // Space+
  ctx.fillStyle="#000";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  for(let i=0;i<50;i++){
    ctx.fillRect(Math.random()*canvas.width,Math.random()*canvas.height,2,2);
  }
}

// ---------- SFX (SOFT) ----------
function pop() {
  const a = new AudioContext();
  const o = a.createOscillator();
  const g = a.createGain();
  o.type="triangle";
  o.frequency.value=500;
  o.connect(g);
  g.connect(a.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+0.1);
  o.stop(a.currentTime+0.1);
}

// ---------- UTILS ----------
function rand() {
  return {
    x: Math.floor(Math.random()*(canvas.width/grid)),
    y: Math.floor(Math.random()*(canvas.height/grid))
  };
}

function updateUI() {
  scoreEl.textContent = "Score: " + score;
  heartsEl.textContent = "❤️".repeat(hearts) + "🤍".repeat(3-hearts);
}

function resetSnake() {
  snake=[{x:15,y:15}];
  dx=1;dy=0;
}

// ---------- GAME ----------
function startGame() {
  resetSnake();
  food=rand();
  score=0;
  hearts=3;
  bomb=scissors=apple=null;
  updateUI();
  loop=setInterval(update,speed);
}

function loseHeart() {
  hearts--;
  updateUI();
  resetSnake();
  if (hearts<=0) endGame();
}

function update() {
  const head={x:snake[0].x+dx,y:snake[0].y+dy};

  if(head.x<0||head.y<0||head.x>=canvas.width/grid||head.y>=canvas.height/grid){
    loseHeart(); return;
  }

  if(bomb && head.x===bomb.x && head.y===bomb.y){
    bomb=null; loseHeart(); return;
  }

  snake.unshift(head);

  if(head.x===food.x && head.y===food.y){
    score+=10;
    pop();
    food=rand();
    updateUI();

    if(Math.random()<0.25){bomb=rand();bombT=60;}
    if(Math.random()<0.2){scissors=rand();scissorsT=60;}
    if(hearts<3 && Math.random()<0.15){apple=rand();appleT=60;}
  } else snake.pop();

  if(scissors && head.x===scissors.x && head.y===scissors.y){
    snake.splice(Math.floor(snake.length/2));
    scissors=null;
  }

  if(apple && head.x===apple.x && head.y===apple.y){
    hearts=Math.min(3,hearts+1);
    apple=null;
    updateUI();
  }

  bombT--; scissorsT--; appleT--;
  if(bombT<=0) bomb=null;
  if(scissorsT<=0) scissors=null;
  if(appleT<=0) apple=null;

  draw();
}

function draw() {
  drawMap();
  ctx.fillStyle="yellow";
  ctx.fillRect(food.x*grid,food.y*grid,grid,grid);
  if(bomb) ctx.fillText("💣",bomb.x*grid+10,bomb.y*grid+15);
  if(scissors) ctx.fillText("✂️",scissors.x*grid+10,scissors.y*grid+15);
  if(apple) ctx.fillText("🍎",apple.x*grid+10,apple.y*grid+15);

  ctx.font="18px serif";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  snake.forEach(s=>ctx.fillText(forms[stage()],s.x*grid+10,s.y*grid+10));
}

function endGame(){
  alert("Game Over! Score: "+score);
  location.reload();
}

// ---------- CONTROLS ----------
document.addEventListener("keydown",e=>{
  if(!musicStarted){
    bgMusic.play().catch(()=>{});
    musicStarted=true;
  }
  if(e.key==="ArrowUp"&&dy===0)dx=0,dy=-1;
  if(e.key==="ArrowDown"&&dy===0)dx=0,dy=1;
  if(e.key==="ArrowLeft"&&dx===0)dx=-1,dy=0;
  if(e.key==="ArrowRight"&&dx===0)dx=1,dy=0;
});

startGame();
</script>

</body>
</html>
